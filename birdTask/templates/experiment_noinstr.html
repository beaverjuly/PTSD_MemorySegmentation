  // Shuffle the stimulus set once at the beginning of the experiment.  This
  // randomisation ensures that each of the four 50‑trial blocks uses a
  // unique subset of 50 images without replacement.  The memory task
  // relies on the stim_img stored in each trial's data, so shuffling
  // here does not interfere with later retrieval.
  stimulus_set_images = jsPsych.randomization.shuffle(stimulus_set_images);

  // Define full-screen background images for each block. These will be
  // cycled through sequentially (one per block) to cue the participant
  // that a new context has begun. The paths are relative to this HTML
  // file.
  // Sky background (always the same for all blocks)
  const sky_background = '../static/img/block_backgrounds/sky.png';
  const block_land_backgrounds = [
    '../static/img/block_backgrounds/layer1.png',
    '../static/img/block_backgrounds/layer2.png',
    '../static/img/block_backgrounds/layer3.png',
    '../static/img/block_backgrounds/layer4.png'
  ];
  // Define a unique practice background used for all practice trials.
  const practice_land_background = '../static/img/block_backgrounds/practice_land_background.png';

  // Expose the sky background globally so that the delay discounting
  // plugin can access it when composing layered backgrounds.
  window.sky_background = sky_background;
  var make_trials = function(practice_no, randomized) {
    var num_trials = 10;

    var is_moving_practice = false;
    var show_missing = false;
    var num_birds = 1;
    var show_bird = true;
    var bird_trial = false;
    var missed_threshold = 3;
    var bag_position = practice_bag_position;
    var bird_position = practice_bird_position;

    var warning_threshold = 16;
    var strong_warning = false;

    // Track the previous trial's coin catch count for quality check logic
    var prev_coins_caught = null;

    // Practice vs main trial configuration
    if (practice_no == 1) {
        is_moving_practice = true;
        show_missing = true;
        show_bird = false;
        missed_threshold = 10;
        num_trials = 1;
        randomized = [0];

    } else if (practice_no == 2 || practice_no == 3) {
        num_trials = 6;
        missed_threshold = 2;
        randomized = [0];

    } else if (practice_no == 4) {
        show_bird = false;
        randomized = [0];

    } else if (practice_no == 0) {
        num_birds = 4;
        show_bird = false;
        bird_trial = true;
        missed_threshold = 20;
        warning_threshold = 16;
        num_trials = 50;
        bag_position = main_bag_position;
        bird_position = main_bird_position;
    }

    var stayed_threshold = 4;
    var birds = [
        "../static/img/bird1.png",
        "../static/img/bird2.png",
        "../static/img/bird3.png",
        "../static/img/bird4.png"
    ];

    // Iteratively define trials
    var trials = [];
    var missed_responses = 0;
    var total_missed_responses = 0; // Cumulative inactivity count across blocks
    var prev_block = null;  // Track block changes to reset inactivity counter
    var k = 0;
    var bucket = 50;
    var stayed = 0;

    for (var j = 0; j < num_birds; j++) {
        // Bird intro trials
        if (bird_trial) {
            trials.push({
                type: 'image-keyboard-response',
                prompt: '<p>A new bird and wind condition! Press use the arrow keys or the space bar to begin (auto in 20s)</p>',
                choices: [32, 37, 39],
                trial_duration: 20000,
                timeline: [{ stimulus: birds[randomized[j]] }]
            });

            trials.push({
                type: 'image-keyboard-response',
                prompt: '<p>Beginning...</p>',
                choices: jsPsych.NO_KEYS,
                trial_duration: 3000,
                timeline: [{ stimulus: birds[randomized[j]] }]
            });
        }

        for (var i = 0; i < num_trials; i++) {
            // Handle k cycling so we never go out of bounds
            var idx = k % coins_duration.length;

            // Defensive slices
            var cdur = Array.isArray(coins_duration[idx]) 
                ? coins_duration[idx].slice() 
                : coins_duration.slice();

            var cdist = Array.isArray(coins_distribution[idx]) 
                ? coins_distribution[idx].slice() 
                : coins_distribution.slice();

            // Select stimulus
            var stim_img = stimulus_set_images[k % stimulus_set_images.length];

            // Define trial
                const trial_te = {
                type: 'trial',
                // Attach experiment metadata to the data object.  In addition to
                // the block and randomized factors, we include the trial index
                // and the stimulus image path.  Storing stim_img here allows
                // the post‑block memory task to recover the image shown on
                // each trial when reconstructing the 50‑trial block.  Without
                // this field the memory task would display a broken image
                // placeholder instead of the original stimulus.
                data: {
                    block: j + 1,
                    randomized: randomized[j],
                    trial: i + 1,
                    // Save the stimulus image path so that it becomes part of
                    // the jsPsych data for this trial.  This is necessary
                    // because the custom trial plugin does not automatically
                    // persist stim_img into the data store.  The memory
                    // plugin later retrieves stim_img from the stored data.
                    stim_img: stim_img
                },

                true_vol_param: (practice_no === 0 ? factors_vol[j] : null),
                true_stc_param: (practice_no === 0 ? factors_stc[j] : null),
                vol_level: (practice_no === 0 ? (factors_vol[j] === 4 ? "low" : "high") : null),
                stc_level: (practice_no === 0 ? (factors_stc[j] === 16 ? "low" : "high") : null),

                // Pass stim_img as a parameter to the trial plugin so it can
                // render the image during the game.  This remains unchanged
                // from the original implementation but is separate from the
                // data object above.
                stim_img: stim_img,
                // Always use the sky background for the canvas backdrop.  The
                // sky layer is drawn by the plugin via CSS and remains
                // constant across blocks.  The land image below is varied per
                // block and practice condition.
                background_img: sky_background,
                land_img: (practice_no === 0
                  ? block_land_backgrounds[j % block_land_backgrounds.length]
                  : practice_land_background),
                coins_duration: cdur,
                coins_distribution: cdist,
                bag_position: bag_position[randomized[j]][i],
                bird_position: bird_position[randomized[j]][i],
                show_bird: show_bird,
                is_moving_practice: is_moving_practice,
                missing_msg_warning_number: warning_threshold,
                on_start: function(trial) {
                    trial.bucket_position = bucket;
                    trial.show_missing = show_missing;
                    trial.strong_warning = strong_warning;
                },
                on_finish: function(data) {
                    var dat = jsPsych.data.getLastTrialData().values()[0];

                    // Capture current trial coin count immediately
                    var current_coins_caught = dat.coins_caught;

                    // Reset inactivity counter when block changes
                    if (prev_block !== null && dat.block !== prev_block) {
                        missed_responses = 0;
                        prev_coins_caught = null;
                    }
                    prev_block = dat.block;

                    bucket = dat.bucket_position;

                    if (dat.trial == num_trials) bucket = 50;

                    stayed = stayed + dat.stayed;
                    show_missing = false;

                    if (stayed == stayed_threshold) {
                        stayed = 0;
                        show_missing = true;

                        // Only count inactivity if neither THIS trial nor the PREVIOUS trial
                        // had a perfect 10 coin catch
                        if (current_coins_caught !== 10 && prev_coins_caught !== 10) {
                          missed_responses++;
                          total_missed_responses++;
                        }

                        if (total_missed_responses >= warning_threshold) {
                          strong_warning = true;
                        }

                        if (total_missed_responses >= missed_threshold) {
                          low_quality = true;
