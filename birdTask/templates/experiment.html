  // Expose the sky background globally.
  window.sky_background = sky_background;

  var make_trials = function(practice_no, randomized) {
    var num_trials = 10;

    var is_moving_practice = false;
    var show_missing = false;
    var num_birds = 1;
    var show_bird = true;
    var bird_trial = false;
    var missed_threshold = 3;
    var bag_position = practice_bag_position;
    var bird_position = practice_bird_position;

    var warning_threshold = 16;
    var strong_warning = false;

    var prev_coins_caught = null;

    var hideStimulus = false;
    if (practice_no === 1 || practice_no === 2 || practice_no === 3 || practice_no === 4) {
      hideStimulus = true;
    }

    // Practice vs main trial configuration
    if (practice_no == 1) {
        is_moving_practice = true;
        show_missing = true;
        show_bird = false;
        missed_threshold = 10;
        num_trials = 1;
        randomized = [0];

    } else if (practice_no == 2 || practice_no == 3) {
        num_trials = 3;
        missed_threshold = 2;
        randomized = [0];

    } else if (practice_no == 4) {
        show_bird = false;
        randomized = [0];

    } else if (practice_no == 5) {
        num_trials = 3;
        show_bird = false;
        randomized = [0];

    } else if (practice_no == 0) {
        num_birds = 4;
        show_bird = false;
        bird_trial = true;
        missed_threshold = 20;
        warning_threshold = 16;
        num_trials = 50;
        bag_position = main_bag_position;
        bird_position = main_bird_position;

        // DEV MODE: cap main-block trial count if ntrials is set
        if (DEV_MODE && DEV_NTRIALS > 0) {
          num_trials = Math.min(num_trials, DEV_NTRIALS);
          console.log('[DEV] Capping main block trials to ' + num_trials);
        }
    }

    var stayed_threshold = 4;
    var birds = [
        "../static/img/bird1.png",
        "../static/img/bird2.png",
        "../static/img/bird3.png",
        "../static/img/bird4.png"
    ];

    var trials = [];
    var missed_responses = 0;
    var total_missed_responses = 0;
    var prev_block = null;
    var k = 0;
    var bucket = 50;
    var stayed = 0;

    for (var j = 0; j < num_birds; j++) {
        if (bird_trial) {
            trials.push({
                type: 'image-keyboard-response',
                prompt: '<p>A new bird and wind condition! Press use the arrow keys or the space bar to begin (auto in 20s)</p>',
                choices: [32, 37, 39],
                trial_duration: 20000,
                timeline: [{ stimulus: birds[randomized[j]] }]
            });

            trials.push({
                type: 'image-keyboard-response',
                prompt: '<p>Beginning...</p>',
                choices: jsPsych.NO_KEYS,
                trial_duration: 3000,
                timeline: [{ stimulus: birds[randomized[j]] }]
            });
        }

        for (var i = 0; i < num_trials; i++) {
            var idx = k % coins_duration.length;

            var cdur = Array.isArray(coins_duration[idx]) 
                ? coins_duration[idx].slice() 
                : coins_duration.slice();

            var cdist = Array.isArray(coins_distribution[idx]) 
                ? coins_distribution[idx].slice() 
                : coins_distribution.slice();

            var stim_img;
            if (practice_no >= 1 && practice_no <= 5) {
                stim_img = practice_stimulus_images[k % practice_stimulus_images.length];
            } else {
                stim_img = stimulus_set_images[k % stimulus_set_images.length];
            }
  
            const trial_te = {
                type: 'trial',
                data: {
                    block: j + 1,
                    randomized: randomized[j],
                    trial: i + 1,
                    stim_img: stim_img
                },

                true_vol_param: (practice_no === 0 ? factors_vol[j] : null),
                true_stc_param: (practice_no === 0 ? factors_stc[j] : null),
                vol_level: (practice_no === 0 ? (factors_vol[j] === 4 ? "low" : "high") : null),
                stc_level: (practice_no === 0 ? (factors_stc[j] === 16 ? "low" : "high") : null),
                
                stim_img: stim_img,
                background_img: sky_background,
                land_img: (practice_no === 0
                  ? block_land_backgrounds[j % block_land_backgrounds.length]
                  : practice_land_background),
                coins_duration: cdur,
                coins_distribution: cdist,
                bag_position: bag_position[randomized[j]][i],
                bird_position: bird_position[randomized[j]][i],
                show_bird: show_bird,
                is_moving_practice: is_moving_practice,
                missing_msg_warning_number: warning_threshold,
                hide_stimulus: hideStimulus,
                on_start: function(trial) {
                    trial.bucket_position = bucket;
                    trial.show_missing = show_missing;
                    trial.strong_warning = strong_warning;
                },
                on_finish: function(data) {
                    var dat = jsPsych.data.getLastTrialData().values()[0];
                    var current_coins_caught = dat.coins_caught;

                    if (prev_block !== null && dat.block !== prev_block) {
                        missed_responses = 0;
                        prev_coins_caught = null;
                    }
                    prev_block = dat.block;

                    bucket = dat.bucket_position;

                    if (dat.trial == num_trials) bucket = 50;

                    stayed = stayed + dat.stayed;
                    show_missing = false;

                    if (stayed == stayed_threshold) {
                        stayed = 0;
                        show_missing = true;

                        if (current_coins_caught !== 10 && prev_coins_caught !== 10) {
                          missed_responses++;
                          total_missed_responses++;
                        }

                        if (total_missed_responses >= warning_threshold) {
                          strong_warning = true;
                        }

                        if (total_missed_responses >= missed_threshold) {
                          low_quality = true;
                          jsPsych.endExperiment();
                        }
                    }

                    prev_coins_caught = current_coins_caught;
                }
            };

            trials.push({
                timeline: [trial_te],
                loop_function: function(data) {
                    return data.values()[0].missing;
                }
            });

            k++;
        }
    }

    return trials;

  // Warm browser image decode cache.
  async function warmImageCache(imagePaths) {
    const uniquePaths = Array.from(new Set(imagePaths || []));
    await Promise.all(uniquePaths.map((src) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = function() {
          if (typeof img.decode === 'function') {
            img.decode().catch(() => {}).finally(resolve);
          } else {
            resolve();
          }
        };
        img.onerror = function() { resolve(); };
        img.src = src;
      });
    }));
  }

  // Keep frequently reused instruction images mounted offscreen.
  function pinImagesOffscreen(imagePaths) {
    const uniquePaths = Array.from(new Set(imagePaths || []));
    const holder = document.createElement('div');
    holder.id = 'img-pin-cache';
    holder.setAttribute('aria-hidden', 'true');
    holder.style.position = 'fixed';
    holder.style.left = '-10000px';
    holder.style.top = '-10000px';
    holder.style.width = '1px';
    holder.style.height = '1px';
    holder.style.overflow = 'hidden';
    holder.style.opacity = '0';
    holder.style.pointerEvents = 'none';

    uniquePaths.forEach((src) => {
      const img = new Image();
      img.src = src;
      img.loading = 'eager';
      img.decoding = 'sync';
      img.width = 2;
      img.height = 2;
      holder.appendChild(img);
    });

    document.body.appendChild(holder);
    window.__imgPinCache = holder;
  }

  // Rewrite instruction image paths to in-memory blob URLs.
  async function localizeInstructionImageSources(imagePaths) {
    const uniquePaths = Array.from(new Set(imagePaths || []));
    const urlMap = {};

    await Promise.all(uniquePaths.map(async (src) => {
      try {
        const res = await fetch(src, { cache: 'force-cache' });
        const blob = await res.blob();
        urlMap[src] = URL.createObjectURL(blob);
      } catch (e) {
        urlMap[src] = src;
      }
    }));

    const instructionNodes = [
      inst_summary, inst1, inst2, inst3, inst4, inst5, inst6, inst7,
      feedback0, feedback1, feedback_p1, feedback_p2, ready, quiz
    ];

    instructionNodes.forEach((node) => {
      if (!node || !Array.isArray(node.pages)) return;
      node.pages = node.pages.map((html) => {
        let next = html;
        uniquePaths.forEach((src) => {
          const localized = urlMap[src] || src;
          next = next.split(src).join(localized);
        });
        return next;
      });
    });

    window.__instructionBlobUrls = Object.values(urlMap).filter((u) => u && u.startsWith('blob:'));
  }

  // Wrap instructions trials so transitions hide until image nodes are ready.
  function addSmoothTransitions(node) {
    if (!node || node.type !== 'instructions') return node;

    const originalOnStart = node.on_start;
    const originalOnLoad = node.on_load;

    node.on_start = function(trial) {
      const display = document.querySelector('.jspsych-display-element');
      if (display) display.classList.add('transitioning');
      if (typeof originalOnStart === 'function') {
        originalOnStart.call(this, trial);
      }
    };

    node.on_load = function() {
      const display = document.querySelector('.jspsych-display-element');
      if (!display) {
        if (typeof originalOnLoad === 'function') originalOnLoad.call(this);
        return;
      }

      const imgs = Array.from(display.querySelectorAll('img'));
      Promise.all(imgs.map((img) => {
        if (img.complete && img.naturalWidth > 0) {
          return (typeof img.decode === 'function') ? img.decode().catch(() => {}) : Promise.resolve();
        }
        return new Promise((resolve) => {
          img.addEventListener('load', () => {
            if (typeof img.decode === 'function') {
              img.decode().catch(() => {}).finally(resolve);
            } else {
              resolve();
            }
          }, { once: true });
          img.addEventListener('error', resolve, { once: true });
        });
      })).finally(() => {
        display.classList.remove('transitioning');
      });

      if (typeof originalOnLoad === 'function') {
        originalOnLoad.call(this);
      }
    };

    return node;
  }
